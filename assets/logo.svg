<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 105" width="100" height="105" role="img" aria-label="Gaia Symbiosis Logo">
  <defs>
    <style>
      /* Static faint base outlines */
      .ring-base {
        fill: none;
        stroke: #c4713a;
        stroke-width: 1.5;
        opacity: 0.18;
      }
      .leaf1-base {
        fill: none;
        stroke: #2d5a3d;
        stroke-width: 1.2;
        stroke-linecap: round;
        opacity: 0.2;
      }
      .leaf2-base {
        fill: none;
        stroke: #c4713a;
        stroke-width: 1.2;
        stroke-linecap: round;
        opacity: 0.2;
      }
      /* Running comet animation */
      .ring-comet {
        fill: none;
        stroke: #c4713a;
        stroke-width: 2.2;
        stroke-linecap: round;
        stroke-dasharray: 0.18 0.82;
        animation: comet 4s linear infinite;
      }
      .leaf1-comet {
        fill: none;
        stroke: #2d5a3d;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-dasharray: 0.18 0.82;
        animation: comet 4s linear infinite;
        animation-delay: -1.33s;
      }
      .leaf2-comet {
        fill: none;
        stroke: #c4713a;
        stroke-width: 1.8;
        stroke-linecap: round;
        stroke-dasharray: 0.18 0.82;
        animation: comet 4s linear infinite;
        animation-delay: -2.67s;
      }
      @keyframes comet {
        0%   { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -1; }
      }
    </style>
  </defs>

  <!-- ── Static filled symbol ── -->

  <!-- Outer halo ring (very faint) -->
  <circle cx="50" cy="47" r="38" fill="none" stroke="#c4713a" stroke-width="0.5" opacity="0.12"/>

  <!-- Left leaf — Gaia / Nature (deep green) -->
  <path d="M50 15
    C28 15 11 29 11 47
    C11 62 21 73 36 77
    C43 79 50 77 50 77
    C33 72 19 62 19 47
    C19 33 33 21 50 15 Z"
    fill="#2d5a3d"/>

  <!-- Right leaf — AI / Technology (terracotta) -->
  <path d="M50 15
    C72 15 89 29 89 47
    C89 62 79 73 64 77
    C57 79 50 77 50 77
    C67 72 81 62 81 47
    C81 33 67 21 50 15 Z"
    fill="#c4713a" opacity="0.82"/>

  <!-- Vertical stem -->
  <line x1="50" y1="77" x2="50" y2="85" stroke="#1a1a1a" stroke-width="1.2" opacity="0.25"/>

  <!-- Apex node -->
  <circle cx="50" cy="15" r="3.2" fill="#c4713a"/>
  <!-- Base node -->
  <circle cx="50" cy="77" r="2.8" fill="#2d5a3d"/>

  <!-- ── Static base outlines (always visible, faint) ── -->
  <circle cx="50" cy="47" r="38" class="ring-base" pathLength="1"/>
  <path d="M50 15 C28 15 11 29 11 47 C11 62 21 73 36 77 C43 79 50 77 C33 72 19 62 19 47 C19 33 33 21 50 15 Z"
    class="leaf1-base" pathLength="1"/>
  <path d="M50 15 C72 15 89 29 89 47 C89 62 79 73 64 77 C57 79 50 77 C67 72 81 62 81 47 C81 33 67 21 50 15 Z"
    class="leaf2-base" pathLength="1"/>

  <!-- ── Running comet traces ── -->
  <circle cx="50" cy="47" r="38" class="ring-comet" pathLength="1"/>
  <path d="M50 15 C28 15 11 29 11 47 C11 62 21 73 36 77 C43 79 50 77 C33 72 19 62 19 47 C19 33 33 21 50 15 Z"
    class="leaf1-comet" pathLength="1"/>
  <path d="M50 15 C72 15 89 29 89 47 C89 62 79 73 64 77 C57 79 50 77 C67 72 81 62 81 47 C81 33 67 21 50 15 Z"
    class="leaf2-comet" pathLength="1"/>

  <!-- ── Wordmark ── -->
  <text x="50" y="97" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="9.5" font-weight="700"
    fill="#1a1a1a" letter-spacing="2.5">GAIA</text>
  <text x="50" y="104.5" text-anchor="middle"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="5.5" fill="#2d5a3d" letter-spacing="3.2">SYMBIOSIS</text>
</svg>
